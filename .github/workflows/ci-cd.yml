name: Java CI/CD to GitOps

on:
  push:
    branches: [ "main" ]
    # Ігноруємо зміни у папці k8s, щоб уникнути нескінченного циклу збирання
    paths-ignore:
      - 'k8s/**' 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build Maven Package (Skip tests as they already passed)
        run: mvn package -DskipTests

      # Заготовка для SonarQube (можна розкоментувати після налаштування токенів)
      # - name: SonarQube Scan
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: mvn sonar:sonar -Dsonar.projectKey=demo-app -Dsonar.host.url=https://sonarcloud.io

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-image
        run: |
          # Генеруємо унікальний тег на основі хешу коміту
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          # GHCR вимагає, щоб назва була у нижньому регістрі
          FULL_IMAGE_NAME=$(echo $FULL_IMAGE_NAME | tr '[A-Z]' '[a-z]')
          
          docker build -t $FULL_IMAGE_NAME .
          docker push $FULL_IMAGE_NAME
          echo "image=$FULL_IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Update Kubernetes manifests
        run: |
          # Налаштовуємо віртуального користувача Git
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # Замінюємо рядок з образом у файлі deployment.yaml на новий
          sed -i "s|image: .*|image: ${{ steps.build-image.outputs.image }}|g" k8s/deployment.yaml
          
          # Комітимо та пушимо зміни назад у репозиторій
          git commit -am "Update image tag to ${{ github.sha }}"
          git push
