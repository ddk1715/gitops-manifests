apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: ghcr.io/ddk1715/gitops-manifests:e9873ca6fb561d62548f3047046a28f75330e537
        ports:
        - containerPort: 8080
