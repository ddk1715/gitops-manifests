apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: ghcr.io/ddk1715/gitops-manifests:5553a7c2b5649bc302fef8528129d2b240c2b5c9
        ports:
        - containerPort: 8080
