apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: ghcr.io/ddk1715/gitops-manifests:d5437dc3a0d57054038527deb2d60228a03b74ee
        ports:
        - containerPort: 8080
