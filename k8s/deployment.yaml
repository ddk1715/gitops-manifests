apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: ghcr.io/ddk1715/gitops-manifests:6fe16215c2f654684f04d9075ab15d83e59afa13
        ports:
        - containerPort: 8080
